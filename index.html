<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#F5F5F2">
    <title>Avenmark Avi Runner</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="app-header">
    <div class="brand">
        <img src="AVA.png" alt="Avenmark" class="logo">
        <div class="brand-copy">
            <h1>Avenmark Avi Runner</h1>
        </div>
    </div>

    <div class="header-controls">
        <button id="pause-button" class="control-button" type="button" aria-label="Pause game">
            Pause
        </button>

        <button id="reset-button" class="control-button" type="button" aria-label="Reset game">
            Reset
        </button>
    </div>
</header>

<main class="runner-shell">
    <section class="game-card" aria-label="Avenmark Avi Runner game">

        <div class="game-area">
            <canvas id="game-canvas" aria-label="Avenmark Avi Runner canvas"></canvas>

            <!-- Start screen -->
            <div id="start-screen" class="game-message active">
                <div class="message-inner">
                    <span class="message-kicker">AVENMARK</span>
                    <h2>Avi is ready.</h2>
                    <p>Jump, keep pace, and don’t let the terrain win.</p>
                    <button id="start-button" class="primary-button" type="button">
                        Start
                    </button>
                </div>
            </div>

            <!-- Rocket intro layer for the launch animation -->
            <div id="rocket-intro" class="rocket-intro hidden" aria-hidden="true">
                <div class="rocket-scene">
                    <div class="rocket" aria-hidden="true">
                        <div class="rocket-window"></div>
                        <div class="rocket-fin rocket-fin-left"></div>
                        <div class="rocket-fin rocket-fin-right"></div>
                    </div>
                    <div class="launch-trail" aria-hidden="true"></div>
                </div>
            </div>

            <!-- Pause screen -->
            <div id="pause-screen" class="game-message hidden" aria-hidden="true">
                <div class="message-inner">
                    <span class="message-kicker">PAUSED</span>
                    <h2>Take a breath.</h2>
                    <button id="resume-button" class="primary-button" type="button">
                        Resume
                    </button>
                </div>
            </div>

            <!-- Game over screen -->
            <div id="game-over-screen" class="game-message hidden" aria-hidden="true">
                <div class="message-inner">
                    <span class="message-kicker">AVENMARK</span>
                    <h2>Is that all you got?</h2>
                    <p id="final-score">Score 0</p>
                    <button id="restart-button" class="primary-button" type="button">
                        Run again
                    </button>
                </div>
            </div>

            <div id="continue-message" class="continue-message" aria-live="polite">
                Continue plz :)
            </div>
        </div>

        <div class="control-panel" aria-label="Game controls and scores">
            <div class="score-group">
                <span class="panel-label">Score</span>
                <strong id="score-display">0</strong>
            </div>

            <div class="score-group">
                <span class="panel-label">High score</span>
                <strong id="high-score-display">0</strong>
            </div>

            <div class="speed-group">
                <div class="speed-heading">
                    <span class="panel-label">Speed</span>
                    <span id="speed-value">1</span>
                </div>

                <input
                    id="speed-slider"
                    type="range"
                    min="0"
                    max="5"
                    step="1"
                    value="1"
                    aria-label="Game speed"
                >
            </div>

            <div class="sound-group">
                <span class="panel-label">Sound</span>
                <button
                    id="sound-toggle"
                    class="toggle-button active"
                    type="button"
                    aria-pressed="true"
                    aria-label="Toggle sound"
                >
                    <span class="toggle-track" aria-hidden="true">
                        <span class="toggle-thumb"></span>
                    </span>
                    <span id="sound-label">On</span>
                </button>
            </div>
        </div>
    </section>
</main>

<script src="script.js"></script>
</body>
</html>
