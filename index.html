<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#F5F5F2"
    >

    <meta
        name="description"
        content="Avenmark Avi Runner — a simple space runner from Avenmark."
    >

    <title>Avenmark Avi Runner</title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <!-- ======================================================
         AVENMARK AVI RUNNER
         ====================================================== -->

    <div class="app">

        <!-- ==================================================
             HEADER
             ================================================== -->

        <header class="app-header">

            <div class="brand">

                <img
                    class="brand-logo"
                    src="AVA.png"
                    alt="Avenmark"
                >

                <div class="brand-title">
                    <h1>Avenmark Avi Runner</h1>
                </div>

            </div>

            <div class="header-actions">

                <button
                    id="pause-button"
                    class="header-button"
                    type="button"
                    aria-label="Pause game"
                >
                    Pause
                </button>

                <button
                    id="reset-button"
                    class="header-button"
                    type="button"
                    aria-label="Reset game"
                >
                    Reset
                </button>

            </div>

        </header>


        <!-- ==================================================
             MAIN GAME
             ================================================== -->

        <main class="game-shell">

            <section
                class="game-container"
                aria-label="Avenmark Avi Runner game"
            >

                <canvas
                    id="game-canvas"
                    aria-label="Avenmark Avi Runner"
                ></canvas>


                <!-- ==========================================
                     START SCREEN
                     ========================================== -->

                <div
                    id="start-screen"
                    class="game-screen"
                >

                    <div class="screen-card">

                        <div class="screen-mark">AVI</div>

                        <h2>Avenmark Avi Runner</h2>

                        <p>
                            Help Avi keep running.
                        </p>

                        <button
                            id="start-button"
                            class="primary-button"
                            type="button"
                        >
                            Start
                        </button>

                    </div>

                </div>


                <!-- ==========================================
                     PAUSED SCREEN
                     ========================================== -->

                <div
                    id="pause-screen"
                    class="game-screen is-hidden"
                    aria-hidden="true"
                >

                    <div class="screen-card">

                        <div class="screen-mark">PAUSED</div>

                        <h2>Take a breather.</h2>

                        <button
                            id="resume-button"
                            class="primary-button"
                            type="button"
                        >
                            Resume
                        </button>

                    </div>

                </div>


                <!-- ==========================================
                     GAME OVER SCREEN
                     ========================================== -->

                <div
                    id="game-over-screen"
                    class="game-screen is-hidden"
                    aria-hidden="true"
                >

                    <div class="screen-card">

                        <div class="screen-mark">AVI</div>

                        <h2>Game over.</h2>

                        <div class="final-score">

                            <span>Score</span>

                            <strong id="final-score-value">
                                0
                            </strong>

                        </div>

                        <button
                            id="restart-button"
                            class="primary-button"
                            type="button"
                        >
                            Run again
                        </button>

                    </div>

                </div>


                <!-- ==========================================
                     500-POINT MESSAGE
                     ========================================== -->

                <div
                    id="continue-message"
                    class="continue-message"
                    aria-live="polite"
                    aria-hidden="true"
                >
                    Continue plz :)
                </div>


                <!-- ==========================================
                     GAME ACCESSIBILITY MESSAGE
                     ========================================== -->

                <div
                    id="game-status"
                    class="sr-only"
                    aria-live="polite"
                >
                    Ready.
                </div>

            </section>


            <!-- ==================================================
                 BOTTOM GAME PANEL
                 ================================================== -->

            <section
                class="game-panel"
                aria-label="Game settings"
            >

                <!-- SCORE -->

                <div class="panel-item score-item">

                    <span class="panel-label">
                        Score
                    </span>

                    <strong
                        id="score"
                        class="panel-value"
                    >
                        0
                    </strong>

                </div>


                <!-- HIGH SCORE -->

                <div class="panel-item high-score-item">

                    <span class="panel-label">
                        High score
                    </span>

                    <strong
                        id="high-score"
                        class="panel-value"
                    >
                        0
                    </strong>

                </div>


                <!-- SPEED -->

                <div class="panel-item speed-item">

                    <div class="speed-heading">

                        <span class="panel-label">
                            Speed
                        </span>

                        <span
                            id="speed-value"
                            class="speed-value"
                        >
                            Normal
                        </span>

                    </div>

                    <input
                        id="speed-slider"
                        class="speed-slider"
                        type="range"
                        min="0.85"
                        max="1.35"
                        step="0.05"
                        value="1"
                        aria-label="Game speed"
                    >

                </div>


                <!-- SOUND -->

                <div class="panel-item sound-item">

                    <span class="panel-label">
                        Sound
                    </span>

                    <button
                        id="sound-toggle"
                        class="sound-toggle"
                        type="button"
                        role="switch"
                        aria-checked="true"
                        aria-label="Turn sound off"
                    >

                        <span
                            class="toggle-track"
                            aria-hidden="true"
                        >

                            <span class="toggle-thumb"></span>

                        </span>

                        <span
                            id="sound-state"
                            class="sound-state"
                        >
                            On
                        </span>

                    </button>

                </div>

            </section>

        </main>

    </div>


    <!-- ======================================================
         SCRIPT
         ====================================================== -->

    <script
        src="script.js"
        defer
    ></script>

</body>
</html>
