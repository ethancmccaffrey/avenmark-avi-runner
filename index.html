<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#F5F5F2"
    >

    <meta
        name="description"
        content="Avenmark Avi Runner"
    >

    <title>Avenmark Avi Runner</title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <!-- ======================================================
         AVENMARK AVI RUNNER
    ======================================================= -->

    <main class="avi-runner">

        <!-- ==================================================
             HEADER
        =================================================== -->

        <header class="app-header">

            <div class="brand">

                <img
                    src="AVA.png"
                    alt="Avenmark"
                    class="logo"
                >

                <div class="brand-copy">
                    <h1>Avenmark</h1>
                </div>

            </div>

            <div class="header-controls">

                <button
                    id="pause-button"
                    class="header-button"
                    type="button"
                    aria-label="Pause game"
                >
                    Pause
                </button>

                <button
                    id="reset-button"
                    class="header-button"
                    type="button"
                    aria-label="Reset game"
                >
                    Reset
                </button>

            </div>

        </header>


        <!-- ==================================================
             GAME AREA
        =================================================== -->

        <section
            class="game-area"
            aria-label="Avenmark Avi Runner game"
        >

            <canvas
                id="game-canvas"
                aria-label="Avenmark Avi Runner"
            ></canvas>


            <!-- ==============================================
                 START SCREEN
            =============================================== -->

            <div
                id="start-screen"
                class="game-screen"
            >

                <div class="screen-card">

                    <div class="screen-mark">
                        AVA
                    </div>

                    <h2>Ready when you are.</h2>

                    <p>
                        Help Avi make it across the terrain.
                    </p>

                    <button
                        id="start-button"
                        class="primary-button"
                        type="button"
                    >
                        Start
                    </button>

                    <span class="screen-hint">
                        Press Space or tap to jump
                    </span>

                </div>

            </div>


            <!-- ==============================================
                 PAUSE SCREEN
            =============================================== -->

            <div
                id="pause-screen"
                class="game-screen hidden"
            >

                <div class="screen-card">

                    <div class="screen-mark">
                        AVA
                    </div>

                    <h2>Paused.</h2>

                    <p>
                        Take a second. Avi can wait.
                    </p>

                    <button
                        id="resume-button"
                        class="primary-button"
                        type="button"
                    >
                        Continue
                    </button>

                </div>

            </div>


            <!-- ==============================================
                 GAME OVER SCREEN
            =============================================== -->

            <div
                id="game-over-screen"
                class="game-screen hidden"
            >

                <div class="screen-card">

                    <div class="screen-mark">
                        AVA
                    </div>

                    <h2>Well, that happened.</h2>

                    <p>
                        Avi made it pretty far.
                    </p>

                    <div class="game-over-score">

                        <div>
                            <span>Score</span>
                            <strong id="final-score">0</strong>
                        </div>

                        <div>
                            <span>High Score</span>
                            <strong id="final-high-score">0</strong>
                        </div>

                    </div>

                    <button
                        id="restart-button"
                        class="primary-button"
                        type="button"
                    >
                        Try again
                    </button>

                </div>

            </div>


            <!-- ==============================================
                 500 POINT MESSAGE
            =============================================== -->

            <div
                id="milestone-message"
                class="milestone-message"
                aria-live="polite"
            >
                Continue plz :)
            </div>

        </section>


        <!-- ==================================================
             BOTTOM CONTROL PANEL
        =================================================== -->

        <section
            class="game-panel"
            aria-label="Game controls and score"
        >

            <!-- SCORE -->

            <div class="panel-stat">

                <span class="panel-label">
                    Score
                </span>

                <strong
                    id="score"
                    class="panel-value"
                >
                    0
                </strong>

            </div>


            <!-- HIGH SCORE -->

            <div class="panel-stat">

                <span class="panel-label">
                    High Score
                </span>

                <strong
                    id="high-score"
                    class="panel-value"
                >
                    0
                </strong>

            </div>


            <!-- SPEED -->

            <div class="panel-control">

                <label
                    for="speed-slider"
                    class="panel-label"
                >
                    Speed
                </label>

                <div class="slider-row">

                    <span
                        class="slider-value"
                        aria-hidden="true"
                    >
                        −
                    </span>

                    <input
                        id="speed-slider"
                        type="range"
                        min="0"
                        max="5"
                        step="1"
                        value="1"
                        aria-label="Game speed"
                    >

                    <span
                        class="slider-value"
                        aria-hidden="true"
                    >
                        +
                    </span>

                </div>

                <span
                    id="speed-value"
                    class="control-status"
                >
                    Normal
                </span>

            </div>


            <!-- SOUND -->

            <div class="panel-control sound-control">

                <span class="panel-label">
                    Sound
                </span>

                <label
                    class="toggle"
                    for="sound-toggle"
                >

                    <input
                        id="sound-toggle"
                        type="checkbox"
                        checked
                        aria-label="Toggle sound"
                    >

                    <span
                        class="toggle-track"
                        aria-hidden="true"
                    >
                        <span class="toggle-thumb"></span>
                    </span>

                </label>

                <span
                    id="sound-status"
                    class="control-status"
                >
                    On
                </span>

            </div>

        </section>

    </main>


    <!-- ======================================================
         SCRIPT
    ======================================================= -->

    <script
        src="script.js"
        defer
    ></script>

</body>
</html>
